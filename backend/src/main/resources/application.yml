spring:
  application:
    name: ems-backend
  ai:
    service:
      base-url: http://localhost:8000

  datasource:
    datasource:
  url: ${DB_URL}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  spring:
    devtools:
      restart:
        enabled: true
      livereload:
        enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
ml:
  service:
    base-url: http://localhost:8000
